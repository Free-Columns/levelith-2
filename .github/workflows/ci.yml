name: CI Pipeline

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20.x'
  MIN_COVERAGE: 80

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # BACKEND CHECKS
  # ============================================================================

  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort

      - name: Check formatting with Black
        run: |
          black --check --diff backend/ dev/ tests/
        continue-on-error: false

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff backend/ dev/ tests/
        continue-on-error: false

      - name: Lint with Flake8
        run: |
          flake8 backend/ dev/ tests/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
          flake8 backend/ dev/ tests/ \
            --count \
            --max-complexity=10 \
            --max-line-length=100 \
            --statistics \
            --exit-zero

  backend-typecheck:
    name: Backend Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-all || pip install mypy

      - name: Type check with MyPy
        run: |
          mypy backend/ dev/ --ignore-missing-imports --strict
        continue-on-error: true

  backend-test:
    name: Backend Tests (Coverage ≥${{ env.MIN_COVERAGE }}%)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          fi
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
          TESTING: true
        run: |
          pytest tests/ \
            -v \
            --cov=backend \
            --cov=dev \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=${{ env.MIN_COVERAGE }}

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80

  # ============================================================================
  # FRONTEND CHECKS
  # ============================================================================

  frontend-lint:
    name: Frontend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found - skipping frontend checks"
            exit 0
          fi

      - name: Check formatting with Prettier
        run: |
          npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}"

      - name: Lint with ESLint
        run: |
          npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings 0

  frontend-typecheck:
    name: Frontend Type Checking
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found - skipping"
            exit 0
          fi

      - name: Type check with TypeScript
        run: |
          npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found - skipping"
            exit 0
          fi

      - name: Run unit tests
        run: |
          npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found - skipping"
            exit 0
          fi

      - name: Build application
        run: |
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # AI AGENT INDEX VALIDATION
  # ============================================================================

  ai-index:
    name: AI Agent Index Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Update AI Agent Index
        run: |
          python dev/aiagent_navigator.py index

      - name: Check if index is up to date
        run: |
          if [ -f .aiagent-index.json ]; then
            git diff --exit-code .aiagent-index.json || \
            (echo "❌ AI Agent index is out of date!" && \
             echo "Run: python dev/aiagent_navigator.py index" && \
             exit 1)
          fi

      - name: Generate navigation guide
        run: |
          python dev/aiagent_navigator.py guide

  # ============================================================================
  # CI STATUS CHECK (Required for PRs)
  # ============================================================================

  ci-success:
    name: ✅ CI Success
    needs:
      - backend-lint
      - backend-typecheck
      - backend-test
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
      - ai-index
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.backend-lint.result }}" != "success" ] || \
             [ "${{ needs.backend-typecheck.result }}" != "success" ] || \
             [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-lint.result }}" != "success" ] || \
             [ "${{ needs.frontend-typecheck.result }}" != "success" ] || \
             [ "${{ needs.frontend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.ai-index.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed!"
            echo ""
            echo "Failed jobs:"
            [ "${{ needs.backend-lint.result }}" != "success" ] && echo "  - Backend Lint"
            [ "${{ needs.backend-typecheck.result }}" != "success" ] && echo "  - Backend Type Check"
            [ "${{ needs.backend-test.result }}" != "success" ] && echo "  - Backend Tests (Coverage ≥80%)"
            [ "${{ needs.frontend-lint.result }}" != "success" ] && echo "  - Frontend Lint"
            [ "${{ needs.frontend-typecheck.result }}" != "success" ] && echo "  - Frontend Type Check"
            [ "${{ needs.frontend-test.result }}" != "success" ] && echo "  - Frontend Tests"
            [ "${{ needs.frontend-build.result }}" != "success" ] && echo "  - Frontend Build"
            [ "${{ needs.ai-index.result }}" != "success" ] && echo "  - AI Agent Index"
            exit 1
          else
            echo "✅ All CI checks passed!"
          fi

      - name: Add PR comment
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **CI Pipeline Failed** - Please check the failed jobs above and fix the issues.'
            })
