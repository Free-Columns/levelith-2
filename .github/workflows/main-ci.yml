name: Main CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'

jobs:
  # Code Quality Check
  quality-check:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files || true
      
      - name: Check context nodes
        run: |
          python dev/cn-validate.py

  # Backend CI
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt yet"
          pip install -r requirements-dev.txt || echo "No requirements-dev.txt yet"
      
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true
      
      - name: Type check with mypy
        run: |
          pip install mypy
          mypy . --ignore-missing-imports || true
      
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest tests/ -v --cov=./ --cov-report=xml --cov-report=html || echo "No tests yet"
      
      - name: Upload coverage
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: backend/htmlcov/

  # Frontend CI
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          npm ci || npm install || echo "No package.json yet"
      
      - name: Lint
        run: |
          npm run lint || echo "No lint script yet"
      
      - name: Type check
        run: |
          npm run type-check || echo "No type-check script yet"
      
      - name: Test
        run: |
          npm run test:ci || npm test || echo "No test script yet"
      
      - name: Build
        run: |
          npm run build || echo "No build script yet"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: frontend/dist/

  # Documentation Build
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Build documentation
        run: |
          pip install mkdocs mkdocs-material || true
          mkdocs build || echo "No MkDocs configuration yet"
      
      - name: Validate context nodes
        run: |
          python dev/cn-validate.py --check-completeness

  # Integration Tests
  integration:
    name: Integration Tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Run integration tests
        run: |
          docker-compose -f docker-compose.test.yml up --abort-on-container-exit || echo "No docker-compose.test.yml yet"

  # Deploy (only on main branch)
  deploy:
    name: Deploy
    needs: [quality-check, backend, frontend, integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          # Add actual deployment steps here
      
      - name: Health check
        run: |
          echo "Performing health check on staging"
          # Add health check commands here
