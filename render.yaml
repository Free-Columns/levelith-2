# Render Infrastructure as Code Configuration
# This file defines all services for the Levelith platform

services:
  # Backend API Service
  - type: web
    name: levelith-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: levelith-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://levelith-frontend.onrender.com,https://levelith.online"
      - key: LOG_LEVEL
        value: INFO
      - key: API_V1_PREFIX
        value: /api/v1
    autoDeploy: true

  # PostgreSQL Database
databases:
  - name: levelith-db
    databaseName: levelith
    user: levelith_user
    plan: starter
    region: oregon
    postgresMajorVersion: 15
