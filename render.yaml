# Render Infrastructure as Code Configuration
# This file defines all services for the Levelith platform

services:
  # Backend API Service
  - type: web
    name: levelith-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: levelith-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://levelith-frontend.onrender.com,https://levelith.online"
      - key: LOG_LEVEL
        value: INFO
      - key: API_V1_PREFIX
        value: /api/v1
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: levelith-frontend
    env: static
    #region: oregon #static sites cant have a region
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://levelith-backend.onrender.com/api/v1"
      - key: VITE_APP_NAME
        value: "Levelith"
      - key: VITE_ENVIRONMENT
        value: "production"
    autoDeploy: true

  # PostgreSQL Database
databases:
  - name: levelith-db
    databaseName: levelith
    user: levelith_user
    plan: free
    region: oregon
    postgresMajorVersion: 15
